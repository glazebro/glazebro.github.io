<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>send</title>
<p id="s">sending…</p>
<script>
(async () => {
  const allowed = ["https://www.linkedin.com", "https://profile.indeed.com", "https://www.indeed.com", "https://my.indeed.com", "https://resume.indeed.com"];
  const buf = await (await fetch("resume.pdf", { cache: "no-store" })).arrayBuffer();
  for (const origin of allowed) {
    try { window.opener && window.opener.postMessage({ type: "resume-pdf", name: "Mike_Glazebrook_Resume_2026.pdf", buf }, origin); } catch (e) {}
  }
  document.getElementById("s").textContent = window.opener ? "sent" : "no opener";
})();
</script>
